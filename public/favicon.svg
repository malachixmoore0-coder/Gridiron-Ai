<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1FF0A8"/>
      <stop offset="1" stop-color="#0C9A6B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <!-- The ball is tilted, the way a football is always drawn — upright it reads
       as an eye. The laces are a rising bar chart, and they stay level, which is
       what makes the mark read as football and market at the same time. -->
  <g transform="rotate(-19 512 512)">
    <path d="M 218 512 Q 512 140 806 512 Q 512 884 218 512 Z" fill="#05080C"/>
  </g>
  <g fill="#1FF0A8">
    <rect x="416" y="524" width="50" height="94" rx="25"/>
    <rect x="487" y="472" width="50" height="146" rx="25"/>
    <rect x="558" y="420" width="50" height="198" rx="25"/>
  </g>
</svg>
