<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- The toad, reduced to the two things that make one recognisable at any
       size: eyes that sit on top of the head rather than in it, and a wide low
       jaw. Everything else is noise below 32px. -->
  <defs>
    <clipPath id="head">
      <circle cx="30" cy="41" r="19"/>
      <circle cx="70" cy="41" r="19"/>
      <ellipse cx="50" cy="60" rx="41" ry="27"/>
    </clipPath>
  </defs>
  <g fill="#12D992">
    <circle cx="30" cy="41" r="19"/>
    <circle cx="70" cy="41" r="19"/>
    <ellipse cx="50" cy="60" rx="41" ry="27"/>
  </g>
  <!-- Pupils, and the mouth as a single wide stroke. Cut from the ground
       colour so the mark works on any background it is placed on. -->
  <g fill="#05080C">
    <circle cx="30" cy="39" r="7.5"/>
    <circle cx="70" cy="39" r="7.5"/>
  </g>
  <path d="M15 67 Q50 71.5 85 67" fill="none" stroke="#05080C" stroke-width="5.5" stroke-linecap="round" clip-path="url(#head)"/>
</svg>
