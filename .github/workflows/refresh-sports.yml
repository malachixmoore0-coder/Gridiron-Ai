name: Refresh multi-sport data

# Basketball, baseball and soccer. One job reads ESPN for every generic league,
# rebuilds its ratings, opens projections for the next twelve days and grades
# anything that finished since the last run.
#
# It runs three times a day rather than every twenty minutes because these
# leagues play most days of the week: a rating does not move between innings,
# and the live scores on screen come straight from the client's own polling,
# not from this file. Leagues out of season return no events and are skipped
# without touching what is already published, so the whole calendar is covered
# by one schedule.

on:
  schedule:
    # 06:20, 14:20 and 22:20 UTC — before the US day starts, mid-afternoon,
    # and after the late slate has finished.
    - cron: '20 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Space-separated league keys (blank = all)'
        required: false
        default: ''
      debug:
        description: 'Set to 1 to dump the raw shape of the league stats response'
        required: false
        default: ''
      probe:
        description: 'Set to 1 to probe candidate ESPN leagues instead of building'
        required: false
        default: ''
      schools:
        description: 'Probe school athletics roster pages instead of building, e.g. "cbase 12"'
        required: false
        default: ''
      soccer:
        description: 'Probe the official league sites instead of building, e.g. "clubs"'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  sports:
    runs-on: ubuntu-latest
    # Every step here talks to somebody else's server, and some of them accept
    # a connection and then say nothing at all. Nothing in this job is worth
    # holding a runner for half an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Half the athletics sites and every official league site build their
      # squad page in the browser, so the pipeline needs one. Cached, because
      # downloading Chromium three times a day is a hundred megabytes of
      # nothing.
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Probe candidate leagues
        if: ${{ github.event.inputs.probe != '' }}
        run: |
          if [ "${{ github.event.inputs.probe }}" = "2" ]; then npm run data:probe2;
          elif [ "${{ github.event.inputs.probe }}" = "3" ]; then npm run data:probe3;
          elif [ "${{ github.event.inputs.probe }}" = "logos" ]; then npm run data:probe -- --logos;
          else npm run data:probe; fi

      - name: Probe school roster pages
        if: ${{ github.event.inputs.schools != '' }}
        # Through the environment rather than into the command line: a school
        # called "Texas A&M" is a valid input and not a shell operator.
        env:
          ARGS: ${{ github.event.inputs.schools }}
        run: npm run data:schools -- $ARGS

      - name: Probe the league sites
        if: ${{ github.event.inputs.soccer != '' }}
        env:
          ARGS: ${{ github.event.inputs.soccer }}
        run: npm run data:soccer -- $ARGS

      - name: Build sport datasets
        if: ${{ github.event.inputs.probe == '' && github.event.inputs.schools == '' && github.event.inputs.soccer == '' }}
        env:
          # Set the workflow input "debug" to anything to have the roster step
          # print what ESPN's league statistics endpoint actually returned.
          ROSTER_DEBUG: ${{ github.event.inputs.debug }}
          LEAGUES: ${{ github.event.inputs.leagues }}
        run: npm run data:sports -- $LEAGUES

      - name: Build the golf dataset
        if: ${{ github.event.inputs.probe == '' && github.event.inputs.schools == '' && github.event.inputs.soccer == '' && (github.event.inputs.leagues == '' || contains(github.event.inputs.leagues, 'pga')) }}
        run: npm run data:golf

      - name: Commit
        run: |
          git config user.name "gridiron-data-bot"
          git config user.email "gridiron-data-bot@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "data: refresh multi-sport datasets"
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected (attempt $attempt) — replaying our update on top of origin/main."
              git fetch origin main
              git reset --soft origin/main
              git add data/live
              git commit -m "data: refresh multi-sport datasets" || true
            done
          fi
