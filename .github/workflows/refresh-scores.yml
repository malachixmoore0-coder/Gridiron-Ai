name: Refresh scores

# Fast path for game days: pulls the ESPN scoreboard, updates team records,
# finalises games on the slate and grades any prediction whose game just ended.
# It does not rebuild ratings, depth charts or rosters, so it runs in seconds
# and produces a diff of a few lines — safe to run every 20 minutes.
#
# The full rebuild (refresh-data.yml) still runs on its own slower schedule.

on:
  schedule:
    # Every 20 minutes on game days (Thu, Sun, Mon) September through January, UTC.
    # Sunday-night and Monday-night finals land early Mon/Tue UTC, so those days are covered too.
    - cron: '7,27,47 * * 9-12,1-2 0-2,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh scores & records
        run: npm run data:scores

      - name: Commit
        run: |
          git config user.name "gridiron-data-bot"
          git config user.email "gridiron-data-bot@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No score changes."
          else
            git commit -m "data: refresh scores & records"
            # Replay ONLY our data on top of whatever landed while we ran.
            #
            # This used to be `git reset --soft origin/main` followed by a commit,
            # which is a quiet disaster: --soft keeps the index built from THIS
            # run's checkout, so committing it writes that whole stale tree back
            # out. Any source pushed while the job was running was reverted
            # without a word -- it deleted a new pipeline module and undid three
            # other files in one go, and the only trace was a commit titled
            # "data: refresh scores & records".
            #
            # Taking origin/main hard and re-applying just our paths keeps
            # somebody else's source exactly as they pushed it.
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected (attempt $attempt) — replaying only our data on top of origin/main."
              ours=$(git rev-parse HEAD)
              git fetch origin main
              git reset --hard origin/main
              git checkout "$ours" -- data/live
              git add data/live
              git diff --cached --quiet || git commit -m "data: refresh scores & records"
            done
          fi
