name: Refresh live data & deploy

# Pulls the latest NFL data (nflverse play-by-play, rosters, depth charts,
# injuries, schedule + lines, PFR advanced stats; ESPN + Open-Meteo best-effort),
# rebuilds data/live/*.json, commits it if anything changed, then rebuilds and
# publishes the web app so the deployed site always carries the fresh data.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions
# (configure-pages below also tries to enable it automatically).

on:
  schedule:
    # Every 3 hours during the season (Sep–Feb), every 12 hours otherwise. UTC.
    - cron: '17 */3 * 9-12,1-2 *'
    - cron: '17 */12 * 3-8 *'
  workflow_dispatch:
    inputs:
      skip_weather:
        description: 'Skip Open-Meteo forecasts'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shares a group with refresh-scores.yml so the two never write data/live at once.
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build live dataset
        run: |
          if [ "${{ inputs.skip_weather }}" = "true" ]; then npm run data:build:offline; else npm run data:build; fi

      - run: npm run test:moderation
      - name: Engine sanity checks against the fresh data
        run: npm run test:engine

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "gridiron-data-bot"
          git config user.email "gridiron-data-bot@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            WEEK=$(node -e "console.log(require('./data/live/meta.json').currentWeek)")
            SEASON=$(node -e "console.log(require('./data/live/meta.json').season)")
            git commit -m "data: refresh live dataset (season $SEASON, week $WEEK)"
            # These files are generated, so a concurrent commit is never worth
            # merging: re-anchor onto whatever landed and keep what we just built.
            for attempt in 1 2 3; do
              git push && break
              echo "Push rejected (attempt $attempt) — replaying our build on top of origin/main."
              git fetch origin main
              git reset --soft origin/main
              git add data/live
              git commit -m "data: refresh live dataset (season $SEASON, week $WEEK)" || true
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Where the site actually lives. Set the repo variable SITE_DOMAIN to a
      # bare hostname (gridironai.com) and the build moves off the project-pages
      # subpath to the root of that domain, writes the CNAME that GitHub Pages
      # needs, and tells the app its own public origin so shared profile links
      # carry the real address. Unset, everything stays on github.io.
      - name: Resolve where the site lives
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            echo "EXPO_BASE_URL=" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SITE_ORIGIN=https://$SITE_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "EXPO_BASE_URL=/$REPO" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SITE_ORIGIN=" >> "$GITHUB_ENV"
          fi
      - name: Export web app
        env:
          # The publishable key is meant to ship — it is compiled into the
          # bundle and every visitor has it. Row-level security is what protects
          # the data from it, which is why `entitlements` has a read-own policy
          # and no insert or update policy at all. Repo variables win when set,
          # so the key can be rotated without a commit.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ndacoxknypbkkhckztub.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_xeEd1B1yNtIMuDeAL0ft9w_i34_sF6n' }}
          EXPO_PUBLIC_ENTITLEMENTS_URL: ${{ vars.ENTITLEMENTS_URL }}
          # e.g. "google,apple" once those providers are configured in Supabase.
          EXPO_PUBLIC_OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
        run: npx expo export --platform web

      - name: Prepare Pages artifact
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          cp dist/index.html dist/404.html
          # GitHub Pages reads the custom domain from this file, so it survives
          # every deploy rather than depending on a setting somebody has to
          # remember to re-apply.
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > dist/CNAME; fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
