name: Deploy web app

# Rebuilds and publishes the web app whenever application code changes on main.
# Data refreshes are handled by refresh-data.yml (which also deploys).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/live/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The web build never opens a browser — only the data pipeline does — so
      # there is no reason for this job to download one.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run test:engine
      - name: Export web app
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npx expo export --platform web
      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
