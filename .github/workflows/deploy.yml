name: Deploy web app

# Rebuilds and publishes the web app whenever application code changes on main.
# Data refreshes are handled by refresh-data.yml (which also deploys).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/live/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The web build never opens a browser — only the data pipeline does — so
      # there is no reason for this job to download one.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run test:engine
      - run: npm run test:moderation
      # Where the site actually lives. Set the repo variable SITE_DOMAIN to a
      # bare hostname (gridironai.com) and the build moves off the project-pages
      # subpath to the root of that domain, writes the CNAME that GitHub Pages
      # needs, and tells the app its own public origin so shared profile links
      # carry the real address. Unset, everything stays on github.io.
      - name: Resolve where the site lives
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            echo "EXPO_BASE_URL=" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SITE_ORIGIN=https://$SITE_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "EXPO_BASE_URL=/$REPO" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SITE_ORIGIN=" >> "$GITHUB_ENV"
          fi
      - name: Export web app
        env:
          # The publishable key is meant to ship — it is compiled into the
          # bundle and every visitor has it. Row-level security is what protects
          # the data from it, which is why `entitlements` has a read-own policy
          # and no insert or update policy at all. Repo variables win when set,
          # so the key can be rotated without a commit.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ndacoxknypbkkhckztub.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_xeEd1B1yNtIMuDeAL0ft9w_i34_sF6n' }}
          EXPO_PUBLIC_ENTITLEMENTS_URL: ${{ vars.ENTITLEMENTS_URL }}
          # e.g. "google,apple" once those providers are configured in Supabase.
          EXPO_PUBLIC_OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
          EXPO_PUBLIC_EMAIL_CODE: ${{ vars.EMAIL_CODE }}
        run: npx expo export --platform web
      - name: Prepare Pages artifact
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          cp dist/index.html dist/404.html
          # GitHub Pages reads the custom domain from this file, so it survives
          # every deploy rather than depending on a setting somebody has to
          # remember to re-apply.
          if [ -n "$SITE_DOMAIN" ]; then echo "$SITE_DOMAIN" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
